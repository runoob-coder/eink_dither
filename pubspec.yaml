name: eink_dither
description: "Apply dithering algorithms to quantize full-color images for limited-color displays like E-Ink, Thermal Printers, and Dot-Matrix Screens."
version: 2.2.2
homepage: https://runoob-coder.github.io/eink_dither/
repository: https://github.com/runoob-coder/eink_dither
issue_tracker: https://github.com/runoob-coder/eink_dither/issues
topics:
  - error-diffusion
  - floyd-steinberg
  - digital-halftoning
  - image-dithering
  - eink

screenshots:
  # Error-diffusion dithering (raster scan)
  - description: "Floyd–Steinberg — raster scan"
    path: result/floydSteinberg_raster.png
  - description: "False Floyd–Steinberg (Heckbert) — raster scan"
    path: result/falseFloydSteinberg_raster.png
  - description: "Stucki — raster scan"
    path: result/stucki_raster.png
  - description: "Atkinson — raster scan"
    path: result/atkinson_raster.png
  - description: "Jarvis–Judice–Ninke — raster scan"
    path: result/jarvisJudiceNinke_raster.png
  - description: "Burkes — raster scan"
    path: result/burkes_raster.png
  - description: "Sierra (Sierra-3) — raster scan"
    path: result/sierra3_raster.png
  - description: "Sierra Lite (Sierra-2-4A) — raster scan"
    path: result/sierraLite_raster.png

  # Ordered dithering
  - description: "Ordered dithering — Bayer 8×8 matrix"
    path: result/bayer8x8.png
  - description: "Ordered dithering — blue-noise (void-and-cluster) mask"
    path: result/blueNoise.png

include:
  - pubspec.yaml
  - CHANGELOG.md
  - LICENSE
  - README.md
  - README_CN.md
  - analysis_options.yaml
  - assets/
  - lib/
  - test/
  - example/lib/
  - result/

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

