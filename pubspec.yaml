name: eink_dither
description: "Apply dithering algorithms to quantize full-color images for limited-color displays like E-Ink, Thermal Printers, and Dot-Matrix Screens."
version: 1.0.0
homepage: https://runoob-coder.github.io/eink_dither/
repository: https://github.com/runoob-coder/eink_dither
issue_tracker: https://github.com/runoob-coder/eink_dither/issues
topics:
  - error-diffusion
  - floyd–steinberg
  - jarvisjudiceninke
  - stucki
  - atkinson

screenshots:
  # Ordered dithering
  - description: "No dithering — plain quantization to the palette"
    path: result/none.png
  - description: "Ordered dithering — Bayer 2×2 matrix"
    path: result/bayer2x2.png
  - description: "Ordered dithering — Bayer 4×4 matrix"
    path: result/bayer4x4.png
  - description: "Ordered dithering — Bayer 8×8 matrix"
    path: result/bayer8x8.png
  - description: "Ordered dithering — blue-noise (void-and-cluster) mask"
    path: result/blueNoise.png

  # Error-diffusion dithering (kernel × scan order)
  - description: "Floyd–Steinberg — raster scan"
    path: result/floydSteinberg_raster.png
  - description: "Floyd–Steinberg — serpentine scan"
    path: result/floydSteinberg_serpentine.png
  - description: "Floyd–Steinberg — zigzag scan"
    path: result/floydSteinberg_zigzag.png
  - description: "Floyd–Steinberg — Hilbert scan"
    path: result/floydSteinberg_hilbert.png

  - description: "False Floyd–Steinberg (Heckbert) — raster scan"
    path: result/falseFloydSteinberg_raster.png
  - description: "False Floyd–Steinberg (Heckbert) — serpentine scan"
    path: result/falseFloydSteinberg_serpentine.png
  - description: "False Floyd–Steinberg (Heckbert) — zigzag scan"
    path: result/falseFloydSteinberg_zigzag.png
  - description: "False Floyd–Steinberg (Heckbert) — Hilbert scan"
    path: result/falseFloydSteinberg_hilbert.png

  - description: "Stucki — raster scan"
    path: result/stucki_raster.png
  - description: "Stucki — serpentine scan"
    path: result/stucki_serpentine.png
  - description: "Stucki — zigzag scan"
    path: result/stucki_zigzag.png
  - description: "Stucki — Hilbert scan"
    path: result/stucki_hilbert.png

  - description: "Atkinson — raster scan"
    path: result/atkinson_raster.png
  - description: "Atkinson — serpentine scan"
    path: result/atkinson_serpentine.png
  - description: "Atkinson — zigzag scan"
    path: result/atkinson_zigzag.png
  - description: "Atkinson — Hilbert scan"
    path: result/atkinson_hilbert.png

  - description: "Jarvis–Judice–Ninke — raster scan"
    path: result/jarvisJudiceNinke_raster.png
  - description: "Jarvis–Judice–Ninke — serpentine scan"
    path: result/jarvisJudiceNinke_serpentine.png
  - description: "Jarvis–Judice–Ninke — zigzag scan"
    path: result/jarvisJudiceNinke_zigzag.png
  - description: "Jarvis–Judice–Ninke — Hilbert scan"
    path: result/jarvisJudiceNinke_hilbert.png

  - description: "Burkes — raster scan"
    path: result/burkes_raster.png
  - description: "Burkes — serpentine scan"
    path: result/burkes_serpentine.png
  - description: "Burkes — zigzag scan"
    path: result/burkes_zigzag.png
  - description: "Burkes — Hilbert scan"
    path: result/burkes_hilbert.png

include:
  - pubspec.yaml
  - CHANGELOG.md
  - LICENSE
  - README.md
  - README_CN.md
  - analysis_options.yaml
  - assets/
  - lib/
  - test/
  - example/lib/
  - result/

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

